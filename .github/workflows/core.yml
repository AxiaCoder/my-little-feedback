name: core

# Path-filtered on purpose: a change to the widget must not rebuild PHP.
# Each component owns its own workflow.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'contracts/**'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'contracts/**'
      - '.github/workflows/core.yml'

defaults:
  run:
    working-directory: core

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # `mlf`, not `mlf_test`: config/packages/doctrine.yaml appends a `_test`
          # suffix in the test environment, so naming the database `mlf_test` here
          # makes the suite look for `mlf_test_test`.
          POSTGRES_DB: mlf
          POSTGRES_USER: mlf
          POSTGRES_PASSWORD: mlf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mlf:mlf@localhost:5432/mlf?serverVersion=16&charset=utf8

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_pgsql, zip, mbstring
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: core

      # These call the Composer scripts rather than the binaries directly, so that
      # CI and a developer's machine run the identical command. `stan` in
      # particular carries a prerequisite — see composer.json — and invoking
      # phpstan straight would silently skip it.
      - name: Coding standards
        run: composer cs

      - name: Static analysis
        run: composer stan

      - name: Tests
        run: composer test

      # The check that replaces the compiler this polyglot repo does not have:
      # if the API contract moved, the committed spec has to move with it.
      - name: OpenAPI contract is up to date
        run: |
          php bin/console nelmio:apidoc:dump --format=yaml > /tmp/openapi.yaml
          if ! diff -q /tmp/openapi.yaml ../contracts/openapi.yaml > /dev/null 2>&1; then
            echo "::error::contracts/openapi.yaml is out of date — regenerate it and commit it in the same change."
            diff -u ../contracts/openapi.yaml /tmp/openapi.yaml || true
            exit 1
          fi
