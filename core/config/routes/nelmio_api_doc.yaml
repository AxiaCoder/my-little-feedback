# Declared by hand rather than imported from the bundle: its recipe lives in
# `recipes-contrib`, which composer.json disables. See config/bundles.php.
nelmio_api_doc.swagger_ui:
    path: /api/doc
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }

nelmio_api_doc.swagger_json:
    path: /api/doc.json
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_json }
