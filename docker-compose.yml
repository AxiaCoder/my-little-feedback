services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlf
      POSTGRES_USER: mlf
      POSTGRES_PASSWORD: mlf
    ports:
      - "5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlf"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    build:
      context: ./core
    environment:
      DATABASE_URL: postgresql://mlf:mlf@postgres:5432/mlf?serverVersion=16&charset=utf8
      APP_ENV: dev
    ports:
      - "8130:8000"
    volumes:
      - ./core:/app
      - /app/vendor
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
